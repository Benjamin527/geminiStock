services:
  gemini-stock:
    build: .
    command: ["ddtrace-run", "python", "-m", "gemini_stock.main"]
    env_file:
      - .env
    environment:
      DD_SERVICE: ${DD_SERVICE:-gemini-worker}
    volumes:
      - ./data:/app/data
      - ./charts:/app/charts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "gemini_stock.healthcheck", "worker"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 30s

  dashboard:
    build: .
    command: ["ddtrace-run", "python", "-m", "gemini_stock.web.app"]
    env_file:
      - .env
    environment:
      DD_SERVICE: ${DD_DASHBOARD_SERVICE:-gemini-dashboard}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./charts:/app/charts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "gemini_stock.healthcheck", "dashboard"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 20s
