[project]
name = "gemini-stock"
version = "0.1.0"
description = "US stock AI watchlist and alert assistant for SPY and QQQ."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.136.1",
  "google-genai==1.74.0",
  "matplotlib==3.10.9",
  "mplfinance==0.12.10b0",
  "numpy==2.4.4",
  "pandas==3.0.2",
  "PyMySQL==1.1.2",
  "pydantic==2.13.3",
  "pydantic-settings==2.14.0",
  "requests==2.33.1",
  "uvicorn==0.46.0",
  "yfinance==1.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["gemini_stock*"]
